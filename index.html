<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rádio Hungria Hip Hop</title>

  <link
    rel="stylesheet"
    href="./src/css/style.css"
  >
</head>

<body>

  <main class="radio">

    <!-- Logo -->
    <div class="logo">
      🎵
    </div>


    <!-- Título -->
    <h1>
      Rádio Hungria Hip Hop
    </h1>


    <!-- Status ao vivo -->
    <div class="live">
      AO VIVO
    </div>


    <!-- Seletor de playlists -->
    <section class="playlist-selector">

      <label for="playlistSelect">
        Playlist
      </label>

      <select
        id="playlistSelect"
      >
        <option value="">
          Carregando playlists...
        </option>
      </select>

    </section>


    <!-- Música atual -->
    <section class="current-track">

      <div
        id="title"
        class="title"
      >
        Carregando...
      </div>

      <div
        id="artist"
        class="artist"
      >
        —
      </div>

    </section>


    <!-- Player -->
    <audio
      id="audio"
      controls
      preload="metadata"
    ></audio>


    <!-- Controles -->
    <div class="buttons">

      <button
        id="previous"
        type="button"
      >
        ⏮ Anterior
      </button>

      <button
        id="play"
        class="play"
        type="button"
      >
        ▶ Tocar
      </button>

      <button
        id="next"
        type="button"
      >
        Próxima ⏭
      </button>

    </div>


    <!-- Próxima música -->
    <div
      id="nextTrack"
      class="next"
    >
      Próxima: —
    </div>


    <!-- Contador -->
    <div
      id="counter"
      class="counter"
    >
      —
    </div>


    <!-- Status -->
    <div
      id="status"
      class="status"
    >
      Carregando playlists...
    </div>


    <!-- Lista de músicas -->
    <section class="playlist-container">

      <div class="playlist-header">
        Músicas
      </div>

      <div
        id="playlist"
        class="playlist"
      ></div>

    </section>

  </main>


  <!-- JavaScript -->
  <script src="./src/js/app.js"></script>

</body>

</html>
