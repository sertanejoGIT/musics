<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rádio Hungria Hip Hop</title>

  <link
    rel="stylesheet"
    href="./src/css/style.css"
  >
</head>

<body>

  <main class="radio">

    <div class="logo">
      🎵
    </div>

    <h1>
      Rádio Hungria Hip Hop
    </h1>

    <div class="live">
      AO VIVO
    </div>

    <div
      id="title"
      class="title"
    >
      Carregando...
    </div>

    <div
      id="artist"
      class="artist"
    >
      —
    </div>

    <audio
      id="audio"
      controls
      preload="metadata"
    ></audio>

    <div class="buttons">

      <button
        id="previous"
      >
        ⏮ Anterior
      </button>

      <button
        id="play"
        class="play"
      >
        ▶ Tocar
      </button>

      <button
        id="next"
      >
        Próxima ⏭
      </button>

    </div>

    <div
      id="nextTrack"
      class="next"
    >
      Próxima: —
    </div>

    <div
      id="counter"
      class="counter"
    >
      —
    </div>

    <div
      id="status"
      class="status"
    >
      Carregando playlist...
    </div>

    <div
      id="playlist"
      class="playlist"
    ></div>

  </main>

  <script src="./src/js/app.js"></script>

</body>
</html>
